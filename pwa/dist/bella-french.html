<style>:root{--bg: #f2f8f4;--surface: #ffffff;--primary: #0f8a5a;--primary-soft: #22ac70;--primary-deep: #053a28;--mint: #e4f1e9;--mint-soft: #f0f8f3;--track: #e6f0ea;--ink: #10261d;--sub: #5e7368;--sub-light: #8ea196;--line: #d7e7dd;--warn: #d9754f;--warn-bg: #fff2e6;--danger: #c23b3b;--danger-bg: #fdecec;--shadow: 0 10px 30px rgba(16, 38, 29, .07);--radius: 22px;--safe-top: env(safe-area-inset-top, 0px);--safe-bottom: env(safe-area-inset-bottom, 0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Helvetica,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}body{min-height:100vh;min-height:100dvh}button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;cursor:pointer}h1,h2,h3,p{margin:0}ul{margin:0;padding:0;list-style:none}.shell{max-width:560px;margin:0 auto;padding:calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 18px);min-height:100dvh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px}.brand h1{font-size:26px;font-weight:800;letter-spacing:-.4px;background:linear-gradient(120deg,var(--primary-deep),var(--primary) 60%,var(--primary-soft));-webkit-background-clip:text;background-clip:text;color:transparent}.brand p{margin-top:2px;font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:.2px}.ring{position:relative;width:56px;height:56px;flex:0 0 auto}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring-track,.ring-fill{fill:none;stroke-width:4.5;stroke-linecap:round}.ring-track{stroke:var(--track)}.ring-fill{stroke:var(--primary-soft);stroke:url(#ringGrad);stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset .7s cubic-bezier(.22,.61,.36,1),stroke .3s}.ring-text{position
