tively charged nucleus containing protons and neutrons, surrounded by negatively charged electrons in energy levels. The number of protons determines the element; in a neutral atom the number of protons equals the number of electrons. Electrons occupy shells, e.g. 2,8,8.","keywords":[{"en":"proton / neutron / electron","cn":"质子 / 中子 / 电子"},{"en":"nucleus","cn":"原子核"},{"en":"energy level / shell","cn":"电子层"},{"en":"atomic number / mass number","cn":"原子序数 / 质量数"},{"en":"isotope","cn":"同位素"},{"en":"electronic configuration","cn":"电子排布"}],"lcTip":"LC 必写 electronic configuration 如 2,8,1；题问 \"why are Group 1 elements reactive?\" 答 \"one outer electron, easily lost to achieve a full outer shell\"。"},{"id":"c27","unit":"lc","book":"衔接","chapter":"LC Strand 1 · Bonding","cn":"离子键与共价键","en":"Ionic and covalent bonding","defCn":"离子键是阴阳离子间的静电吸引，通常形成于金属与非金属之间；共价键是原子间共用电子对形成的作用，通常形成于非金属之间。离子化合物熔沸点高、熔融或溶于水时导电；共价化合物多不导电。","defEn":"An ionic bond is the electrostatic attraction between oppositely charged ions, usually formed between a metal and a non-metal by electron transfer. A covalent bond is a shared pair of electrons between two non-metal atoms. Ionic compounds have high melting points and conduct when molten or dissolved; covalent compounds generally do not conduct.","keywords":[{"en":"ionic bond","cn":"离子键"},{"en":"covalent bond","cn":"共价键"},{"en":"electron transfer / sharing","cn":"电子转移 / 共用"},{"en":"electrostatic attraction","cn":"静电吸引"},{"en":"ion","cn":"离子"},{"en":"lone pair","cn":"孤对电子"},{"en":"dative covalent bond","cn":"配位键"}],"lcTip":"LC Strand 2 Bonding 高频：比较 ionic vs covalent 用表格（particles / bonding / mp / conductivity / solubility）。画图题用 dot-and-cross diagram，注意标出电荷。"},{"id":"c28","unit":"lc","book":"衔接","chapter":"LC Strand 1 · The mole","cn":"物质的量与摩尔","en":"The mole and amount of substance","defCn":"摩尔是物质的量的单位，1 mol 物质含约 6.02×10²³ 个微粒（阿伏伽德罗常数）。物质的量 n = 质量 m ÷ 摩尔质量 M，单位 mol。","defEn":"The mole is the SI unit for the amount of substance. One mole contains 6.02 × 10²³ particles (the Avogadro constant). The number of moles n = mass m ÷ molar mass M, where M is in g/mol.","keywords":[{"en":"mole (mol)","cn":"摩尔"},{"en":"Avogadro constant","cn":"阿伏伽德罗常数"},{"en":"molar mass","cn":"摩尔质量"},{"en":"amount of substance","cn":"物质的量"},{"en":"stoichiometry","cn":"化学计量"},{"en":"mole ratio","cn":"物质的量之比"}],"lcTip":"LC 化学计算核心工具：n = m/M；用方程式的系数比（mole ratio）换算。答题必须写 \"n = m/M\" 和单位，只写答案不给过程会扣分。"},{"id":"c29","unit":"lc","book":"衔接","chapter":"LC Strand 4 · Acids and bases","cn":"酸、碱与中和反应","en":"Acids, bases and neutralisation","defCn":"酸在水溶液中电离产生 H⁺，碱产生 OH⁻。酸与碱反应生成盐和水，称为中和反应。pH 小于 7 为酸性，等于 7 为中性，大于 7 为碱性。","defEn":"An acid produces H⁺(aq) ions in water; a base produces OH⁻(aq) ions. Neutralisation is the reaction between an acid and a base to form a salt and water. A pH below 7 is acidic, 7 is neutral and above 7 is alkaline.","keywords":[{"en":"acid / base / alkali","cn":"酸 / 碱 / 可溶性碱"},{"en":"neutralisation","cn":"中和反应"},{"en":"salt","cn":"盐"},{"en":"pH scale","cn":"pH 标度"},{"en":"indicator","cn":"指示剂"},{"en":"H⁺ / OH⁻ ion","cn":"氢离子 / 氢氧根"}],"lcTip":"LC 必背 ionic equation：H⁺(aq) + OH⁻(aq) → H₂O(l)。滴定时写 \"end point indicated by colour change of phenolphthalein/methyl orange\"。"},{"id":"c30","unit":"lc","book":"衔接","chapter":"LC Strand 4 · Volumetric analysis","cn":"滴定与浓度计算","en":"Volumetric analysis and concentration","defCn":"滴定是用已知浓度的溶液逐滴加入待测液，直到指示剂变色达到终点，从而求出未知浓度。浓度 c = 物质的量 n ÷ 体积 V（单位 mol/L）。","defEn":"Titration is a technique in which a solution of known concentration is added to a measured volume of another solution until the end point is reached, allowing the unknown concentration to be calculated. Concentration c = number of moles n ÷ volume V (mol/L).","keywords":[{"en":"titration","cn":"滴定"},{"en":"end point","cn":"终点"},{"en":"indicator","cn":"指示剂"},{"en":"standard solution","cn":"标准溶液"},{"en":"concentration (mol/L)","cn":"浓度"},{"en":"burette / pipette","cn":"滴定管 / 移液管"}],"lcTip":"LC 实验题常考操作细节：rinse burette with the acid, read at eye level from the bottom of the meniscus, add dropwise near the end point, repeat to get concordant titres。"},{"id":"c31","unit":"lc","book":"衔接","chapter":"LC Strand 3 · Rates of reaction","cn":"化学反应速率","en":"Rates of reaction","defCn":"反应速率表示单位时间内反应物或生成物浓度的变化。升高温度、增大浓度、增大接触面积、使用催化剂和使用更高freq的光都能加快反应；本质是有效碰撞次数增加。","defEn":"The rate of reaction is the change in concentration of a reactant or product per unit time. Rate increases with higher temperature, higher concentration, greater surface area and the presence of a catalyst, because these increase the frequency of successful collisions.","keywords":[{"en":"rate of reaction","cn":"反应速率"},{"en":"collision theory","cn":"碰撞理论"},{"en":"activation energy","cn":"活化能"},{"en":"catalyst","cn":"催化剂"},{"en":"surface area","cn":"接触面积"},{"en":"successful collision","cn":"有效碰撞"}],"lcTip":"LC 解释影响因素必须用 collision theory 语言：\"more particles per unit volume → more frequent collisions → faster rate\"。只写 \"more reactive\" 不给分。"},{"id":"c32","unit":"lc","book":"衔接","chapter":"LC Strand 3 · Equilibrium","cn":"化学平衡","en":"Chemical equilibrium","defCn":"可逆反应中正反应速率与逆反应速率相等、各物质浓度保持不变时达到动态平衡。改变浓度、温度或压强会使平衡移动（勒夏特列原理）。","defEn":"Dynamic equilibrium is reached in a reversible reaction when the forward and reverse rates are equal and the concentrations of all species remain constant. Changes in concentration, temperature or pressure shift the equilibrium according to Le Chatelier's principle.","keywords":[{"en":"dynamic equilibrium","cn":"动态平衡"},{"en":"reversible reaction","cn":"可逆反应"},{"en":"Le Chatelier's principle","cn":"勒夏特列原理"},{"en":"forward / reverse reaction","cn":"正 / 逆反应"},{"en":"yield","cn":"产率"}],"lcTip":"LC 答题模板：\"the system opposes the change\"——先说移动方向，再说对产率的影响。温度影响要结合反应是 exothermic 还是 endothermic。"},{"id":"c33","unit":"lc","book":"衔接","chapter":"LC Strand 2 · Gases","cn":"气体与气体定律","en":"Gases and the gas laws","defCn":"根据分子运动论，气体分子间距离大、运动快，压强来自分子与器壁的碰撞。玻意耳定律：温度不变时压强与体积成反比；查理定律：压强不变时体积与热力学温度成正比。","defEn":"According to kinetic theory, gas particles are far apart and move rapidly; pressure results from collisions with the container walls. Boyle's law states that at constant temperature pressure is inversely proportional to volume; Charles' law states that at constant pressure volume is proportional to absolute temperature.","keywords":[{"en":"kinetic theory","cn":"分子运动论"},{"en":"Boyle's law","cn":"玻意耳定律"},{"en":"Charles' law","cn":"查理定律"},{"en":"absolute temperature (K)","cn":"热力学温度"},{"en":"pressure","cn":"压强"}],"lcTip":"LC 计算用 P₁V₁/T₁ = P₂V₂/T₂，温度必须换算为 Kelvin（K = °C + 273）。写答案时说明 \"at constant temperature / pressure\" 的前提条件。"},{"id":"c34","unit":"lc","book":"衔接","chapter":"LC Strand 4 · Organic chemistry","cn":"有机物入门","en":"Introduction to organic chemistry","defCn":"有机物是含碳化合物（少数简单含碳化合物除外）。烃只含碳和氢，分烷烃、烯烃和炔烃；同系物结构相似、组成相差一个或多个 CH₂，化学性质相似。","defEn":"Organic compounds contain carbon (with a few exceptions). Hydrocarbons contain only carbon and hydrogen and are classified as alkanes, alkenes or alkynes. A homologous series has the same functional group and general formula, with successive members differing by CH₂.","keywords":[{"en":"organic compound","cn":"有机物"},{"en":"hydrocarbon","cn":"烃"},{"en":"alkane / alkene / alkyne","cn":"烷烃 / 烯烃 / 炔烃"},{"en":"homologous series","cn":"同系物"},{"en":"functional group","cn":"官能团"},{"en":"isomer","cn":"同分异构体"},{"en":"IUPAC nomenclature","cn":"IUPAC 命名"}],"lcTip":"LC 命名题按 IUPAC：选最长碳链 → 编号（取代基位次最小）→ 写前缀+词根+后缀。烯烃用 bromine water 褪色检验（addition 反应）。"},{"id":"c35","unit":"t3","book":"八年级","chapter":"专题5 课题3 结构多样的碳单质","cn":"碳单质的多样性","en":"Allotropes of carbon","defCn":"金刚石、石墨和 C₆₀ 都是由碳元素组成的不同单质，因碳原子排列方式不同而性质差异很大：金刚石硬度极大、不导电；石墨质软、能导电；C₆₀ 由足球状分子构成。","defEn":"Allotropes are different forms of the same element in the same physical state. Diamond, graphite and C60 are allotropes of carbon: their atoms are arranged differently, so diamond is very hard and does not conduct electricity, while graphite is soft and conducts electricity.","keywords":[{"en":"allotrope","cn":"同素异形体"},{"en":"diamond","cn":"金刚石"},{"en":"graphite","cn":"石墨"},{"en":"giant covalent structure","cn":"巨型共价结构"},{"en":"delocalised electron","cn":"离域电子"},{"en":"fullerene","cn":"富勒烯"}],"lcTip":"LC 结构题必须把 structure → property → use 串起来：graphite 的 layered structure + delocalised electrons → conducts electricity → electrodes；diamond 的 rigid 3D network → very hard → cutting tools。只写性质不给结构理由会丢分。"}]},"formulas":{"units":[{"key":"bio","label":"生物 · 生理表达式","subject":"bio"},{"key":"bio-gen","label":"生物 · 遗传图解","subject":"bio"},{"key":"chem-base","label":"化学 · 基础化学式","subject":"chem"},{"key":"chem-eq","label":"化学 · 必背方程式","subject":"chem"},{"key":"chem-calc","label":"化学 · 计算公式","subject":"chem"}],"formulas":[{"id":"f01","unit":"bio","type":"bio-word","cn":"光合作用","en":"Photosynthesis","expr":"二氧化碳 + 水 ——(光能 / 叶绿体)→ 葡萄糖 + 氧气","exprEn":"carbon dioxide + water —(light energy / chlorophyll)→ glucose + oxygen","formula":"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂","cond":"光照、叶绿体（叶绿素）","condEn":"light energy, chlorophyll in chloroplasts","noteCn":"合成有机物、储存能量的过程。LC 里必须写出 light energy 和 chlorophyll 两个条件，缺一扣分。","noteEn":"An endothermic reaction storing energy. Always include light energy and chlorophyll when writing the word equation in LC.","keywords":[{"en":"endothermic","cn":"吸热"},{"en":"chlorophyll","cn":"叶绿素"},{"en":"limiting factor","cn":"限制因素"}]},{"id":"f02","unit":"bio","type":"bio-word","cn":"有氧呼吸","en":"Aerobic respiration","expr":"有机物（葡萄糖）+ 氧气 ——(酶)→ 二氧化碳 + 水 + 能量","exprEn":"glucose + oxygen —(enzymes)→ carbon dioxide + water + energy (ATP)","formula":"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy","cond":"酶、线粒体","condEn":"enzymes, mitochondria","noteCn":"释放能量的过程，与光合作用的反应物、生成物正好相反。ATP 是细胞的能量货币。","noteEn":"Exothermic; the reverse of photosynthesis in terms of reactants and products. ATP is the energy currency of the cell.","keywords":[{"en":"exothermic","cn":"放热"},{"en":"ATP","cn":"ATP"},{"en":"mitochondrion","cn":"线粒体"}]},{"id":"f03","unit":"bio","type":"bio-word","cn":"无氧呼吸（酵母）","en":"Anaerobic respiration in yeast","expr":"葡萄糖 ——(酶、无氧)→ 酒精 + 二氧化碳 + 少量能量","exprEn":"glucose —(enzymes, no oxygen)→ ethanol + carbon dioxide + small amount of energy","formula":"C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ + energy","cond":"无氧、酶","condEn":"absence of oxygen, enzymes (zymase)","noteCn":"酵母的酒精发酵，用于酿酒和面包。 muscle 无氧呼吸产物是乳酸而非酒精。","noteEn":"Alcoholic fermentation in yeast; used in brewing and baking. In human muscle, anaerobic respiration produces lactic acid instead.","keywords":[{"en":"fermentation","cn":"发酵"},{"en":"ethanol","cn":"乙醇"},{"en":"lactic acid","cn":"乳酸"}]},{"id":"f04","unit":"bio","type":"bio-word","cn":"淀粉的消化","en":"Digestion of starch","expr":"淀粉 ——(唾液淀粉酶)→ 麦芽糖 ——(麦芽糖酶)→ 葡萄糖","exprEn":"starch —(amylase)→ maltose —(maltase)→ glucose","formula":"(C₆H₁₀O₅)n + nH₂O → nC₆H₁₂O₆","cond":"淀粉酶、麦芽糖酶","condEn":"amylase in saliva and pancreatic juice; maltase in small intestine","noteCn":"淀粉最终分解为可吸收的葡萄糖，在小肠完成吸收。","noteEn":"Starch is broken down to glucose for absorption in the small intestine. LC food tests: iodine for starch, Benedict's for reducing sugar.","keywords":[{"en":"amylase","cn":"淀粉酶"},{"en":"maltose","cn":"麦芽糖"},{"en":"glucose","cn":"葡萄糖"}]},{"id":"f05","unit":"bio","type":"bio-word","cn":"蛋白质的消化","en":"Digestion of protein","expr":"蛋白质 ——(胃蛋白酶 / 胰蛋白酶)→ 多肽 ——(肽酶)→ 氨基酸","exprEn":"protein —(pepsin / trypsin)→ peptides —(peptidases)→ amino acids","formula":"protein + H₂O → amino acids","cond":"胃酸、蛋白酶","condEn":"stomach acid, proteases","noteCn":"蛋白质最终分解为氨基酸才能被吸收，用于合成人体自身蛋白质。","noteEn":"Amino acids are the building blocks used for growth and repair. Biuret test detects protein (blue → purple).","keywords":[{"en":"pepsin","cn":"胃蛋白酶"},{"en":"peptide","cn":"多肽"},{"en":"amino acid","cn":"氨基酸"}]},{"id":"f06","unit":"bio","type":"bio-word","cn":"气体交换 · 扩散方向","en":"Gas exchange by diffusion","expr":"肺泡(O₂ 高) → 血液(O₂ 低)；血液(CO₂ 高) → 肺泡(CO₂ 低)","exprEn":"alveoli (high O₂) → blood (low O₂); blood (high CO₂) → alveoli (low CO₂)","formula":"沿浓度梯度：高浓度 → 低浓度","cond":"肺泡壁与毛细血管壁均一层细胞","condEn":"alveolar and capillary walls are one cell thick","noteCn":"组织的气体交换方向相反：血液给组织送 O₂、带走 CO₂。","noteEn":"At body tissues the direction reverses: oxygen leaves the blood and carbon dioxide enters it. Always write \"down a concentration gradient\".","keywords":[{"en":"diffusion gradient","cn":"扩散梯度"},{"en":"alveolus","cn":"肺泡"},{"en":"capillary","cn":"毛细血管"}]},{"id":"f07","unit":"bio-gen","type":"genetics","cn":"一对相对性状的杂交（完全显性）","en":"Monohybrid cross (complete dominance)","expr":"P：AA × aa → F₁：全部 Aa（显性）→ F₁ 自交 Aa × Aa → F₂：1AA : 2Aa : 1aa","exprEn":"P: AA × aa → F1: all Aa (dominant phenotype) → F1 selfed: Aa × Aa → F2: 1 AA : 2 Aa : 1 aa","formula":"基因型比 1:2:1 ｜ 表现型比 3:1","cond":"显性完全掩盖隐性","condEn":"complete dominance","noteCn":"LC 必须画出 Punnett square，写清配子、F₁、F₂ 与两种比例。","noteEn":"LC requires a Punnett square with parental genotypes, gametes, F1/F2 and both the genotypic (1:2:1) and phenotypic (3:1) ratios.","keywords":[{"en":"Punnett square","cn":"遗传图解"},{"en":"genotype / phenotype ratio","cn":"基因型 / 表现型比"},{"en":"heterozygous","cn":"杂合子"}]},{"id":"f08","unit":"bio-gen","type":"genetics","cn":"测交","en":"Test cross","expr":"未知显性个体 × 隐性纯合子(aa) → 子代全显性则为 AA；出现 1:1 则为 Aa","exprEn":"unknown dominant individual × homozygous recessive (aa) → all dominant offspring means AA; a 1:1 ratio means Aa","formula":"Aa × aa → 1Aa : 1aa（表现型 1:1）","cond":"与隐性纯合子杂交","condEn":"cross with homozygous recessive","noteCn":"用于判断显性性状个体的基因型。","noteEn":"A test cross reveals the genotype of an individual showing the dominant phenotype.","keywords":[{"en":"test cross","cn":"测交"},{"en":"homozygous recessive","cn":"隐性纯合子"},{"en":"carrier","cn":"携带者"}]},{"id":"f09","unit":"bio-gen","type":"genetics","cn":"性别决定","en":"Sex determination","expr":"母 XX（配子全 X）× 父 XY（配子 X 或 Y）→ 女 XX : 男 XY = 1 : 1","exprEn":"mother XX (all X ova) × father XY (X or Y sperm) → female XX : male XY = 1 : 1","formula":"XX × XY → XX : XY = 1 : 1","cond":"精子类型决定性别","condEn":"the sperm determines the sex of the offspring","noteCn":"每次受精生男生女概率均为 50%，与上次结果无关。","noteEn":"Each fertilisation is independent: the probability of a boy or a girl is 50% each time.","keywords":[{"en":"sex chromosome","cn":"性染色体"},{"en":"gamete","cn":"配子"},{"en":"probability","cn":"概率"}]},{"id":"f10","unit":"chem-base","type":"chem-eq","cn":"常见单质的化学式","en":"Formulae of common elements","expr":"氧气 O₂ ｜ 氮气 N₂ ｜ 氢气 H₂ ｜ 氯气 Cl₂ ｜ 碳 C ｜ 铁 Fe ｜ 镁 Mg ｜ 铜 Cu","exprEn":"oxygen O₂ ｜ nitrogen N₂ ｜ hydrogen H₂ ｜ chlorine Cl₂ ｜ carbon C ｜ iron Fe ｜ magnesium Mg ｜ copper Cu","formula":"O₂ · N₂ · H₂ · Cl₂（气态非金属多为双原子分子）","cond":"元素符号首字母大写，第二个字母小写","condEn":"first letter capital, second letter lower case","noteCn":"稀有气体（He、Ne、Ar）是单原子分子，金属和固态非金属用元素符号直接表示。","noteEn":"Noble gases are monatomic; metals and solid non-metals are represented by their symbol alone. Always write correct case: Co ≠ CO.","keywords":[{"en":"diatomic molecule","cn":"双原子分子"},{"en":"monatomic","cn":"单原子"},{"en":"chemical symbol","cn":"元素符号"}]},{"id":"f11","unit":"chem-base","type":"chem-eq","cn":"常见化合物的化学式","en":"Formulae of common compounds","expr":"水 H₂O ｜ 二氧化碳 CO₂ ｜ 一氧化碳 CO ｜ 氯化钠 NaCl ｜ 碳酸钙 CaCO₃ ｜ 硫酸 H₂SO₄ ｜ 氢氧化钠 NaOH","exprEn":"water H₂O ｜ carbon dioxide CO₂ ｜ carbon monoxide CO ｜ sodium chloride NaCl ｜ calcium carbonate CaCO₃ ｜ sulfuric acid H₂SO₄ ｜ sodium hydroxide NaOH","formula":"H₂O · CO₂ · NaCl · CaCO₃ · H₂SO₄ · NaOH","cond":"正负化合价代数和为零","condEn":"total positive and negative valencies sum to zero","noteCn":"书写依据：正价在前、负价在后，十字交叉确定原子个数。","noteEn":"Use valencies to deduce formulae; in LC also state oxidation numbers when asked.","keywords":[{"en":"valency","cn":"化合价"},{"en":"oxidation number","cn":"氧化数"},{"en":"compound","cn":"化合物"}]},{"id":"f12","unit":"chem-base","type":"chem-eq","cn":"常见离子","en":"Common ions","expr":"Na⁺ ｜ K⁺ ｜ Ca²⁺ ｜ Mg²⁺ ｜ Al³⁺ ｜ Cl⁻ ｜ O²⁻ ｜ OH⁻ ｜ SO₄²⁻ ｜ CO₃²⁻ ｜ NO₃⁻ ｜ NH₄⁺","exprEn":"sodium Na⁺ ｜ potassium K⁺ ｜ calcium Ca²⁺ ｜ magnesium Mg²⁺ ｜ aluminium Al³⁺ ｜ chloride Cl⁻ ｜ oxide O²⁻ ｜ hydroxide OH⁻ ｜ sulfate SO₄²⁻ ｜ carbonate CO₃²⁻ ｜ nitrate NO₃⁻ ｜ ammonium NH₄⁺","formula":"cation（正离子）+ anion（负离子）→ ionic compound","cond":"离子所带电荷写在符号右上角","condEn":"the charge is written as a superscript","noteCn":"爱尔兰用 sulfate / aluminium / aluminium 的拼写，不是 sulfate 美式 sulfur 混用。","noteEn":"Irish exams use British spellings: sulfate, aluminium, sulphur.","keywords":[{"en":"cation / anion","cn":"阳离子 / 阴离子"},{"en":"ionic compound","cn":"离子化合物"},{"en":"charge","cn":"电荷"}]},{"id":"f13","unit":"chem-eq","type":"chem-eq","cn":"碳在氧气中燃烧","en":"Combustion of carbon","expr":"碳 + 氧气 ——(点燃)→ 二氧化碳","exprEn":"carbon + oxygen —(ignition)→ carbon dioxide","formula":"C(s) + O₂(g) → CO₂(g)","cond":"点燃","condEn":"ignition / burning","noteCn":"氧气充足生成 CO₂；氧气不足生成有毒的 CO。","noteEn":"In limited oxygen, poisonous carbon monoxide is produced: 2C(s) + O₂(g) → 2CO(g).","keywords":[{"en":"combustion","cn":"燃烧"},{"en":"complete / incomplete combustion","cn":"完全 / 不完全燃烧"},{"en":"carbon monoxide","cn":"一氧化碳"}]},{"id":"f14","unit":"chem-eq","type":"chem-eq","cn":"镁条燃烧","en":"Burning of magnesium","expr":"镁 + 氧气 ——(点燃)→ 氧化镁","exprEn":"magnesium + oxygen —(ignition)→ magnesium oxide","formula":"2Mg(s) + O₂(g) → 2MgO(s)","cond":"点燃，发出耀眼白光","condEn":"ignition, brilliant white flame","noteCn":"化合反应，生成白色固体氧化镁。","noteEn":"A combination reaction giving a white solid. LC observation: burns with a brilliant white flame.","keywords":[{"en":"combination reaction","cn":"化合反应"},{"en":"observation","cn":"实验现象"},{"en":"magnesium oxide","cn":"氧化镁"}]},{"id":"f15","unit":"chem-eq","type":"chem-eq","cn":"氢气燃烧","en":"Combustion of hydrogen","expr":"氢气 + 氧气 ——(点燃)→ 水","exprEn":"hydrogen + oxygen —(ignition)→ water","formula":"2H₂(g) + O₂(g) → 2H₂O(l)","cond":"点燃","condEn":"ignition","noteCn":"产物只有水，是清洁能源。检验氢气用 burning splint 有轻微爆鸣声。","noteEn":"Clean fuel producing only water. Test for hydrogen: a burning splint gives a squeaky pop.","keywords":[{"en":"squeaky pop test","cn":"爆鸣试验"},{"en":"clean fuel","cn":"清洁能源"}]},{"id":"f16","unit":"chem-eq","type":"chem-eq","cn":"过氧化氢分解制氧气","en":"Decomposition of hydrogen peroxide","expr":"过氧化氢 ——(二氧化锰催化)→ 水 + 氧气","exprEn":"hydrogen peroxide —(manganese dioxide catalyst)→ water + oxygen","formula":"2H₂O₂(aq) → 2H₂O(l) + O₂(g)","cond":"MnO₂ 作催化剂，常温","condEn":"manganese dioxide catalyst, room temperature","noteCn":"分解反应。MnO₂ 加快反应但本身质量和化学性质不变。","noteEn":"A decomposition reaction. MnO₂ is a catalyst: it speeds up the reaction and is unchanged at the end.","keywords":[{"en":"catalyst","cn":"催化剂"},{"en":"decomposition","cn":"分解反应"},{"en":"activation energy","cn":"活化能"}]},{"id":"f17","unit":"chem-eq","type":"chem-eq","cn":"加热高锰酸钾制氧气","en":"Thermal decomposition of potassium permanganate","expr":"高锰酸钾 ——(加热)→ 锰酸钾 + 二氧化锰 + 氧气","exprEn":"potassium permanganate —(heat)→ potassium manganate(VII) + manganese dioxide + oxygen","formula":"2KMnO₄(s) → K₂MnO₄(s) + MnO₂(s) + O₂(g)","cond":"加热；试管口略向下倾斜","condEn":"heat; mouth of test tube slightly tilted down","noteCn":"LC 用 potassium manganate(VII) 命名。试管口向下防止冷凝水倒流炸裂。","noteEn":"LC uses potassium manganate(VII). Tilt the test tube downwards to prevent condensed water running back and cracking it.","keywords":[{"en":"thermal decomposition","cn":"热分解"},{"en":"oxidation state","cn":"氧化态"}]},{"id":"f18","unit":"chem-eq","type":"chem-eq","cn":"实验室制取二氧化碳","en":"Laboratory preparation of carbon dioxide","expr":"碳酸钙 + 盐酸 → 氯化钙 + 水 + 二氧化碳","exprEn":"calcium carbonate + hydrochloric acid → calcium chloride + water + carbon dioxide","formula":"CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g)","cond":"常温，大理石 + 稀盐酸","condEn":"room temperature, marble chips and dilute HCl","noteCn":"复分解后碳酸分解。不用硫酸（生成微溶 CaSO₄ 覆盖表面使反应停止）。","noteEn":"Do not use sulfuric acid: insoluble calcium sulfate coats the marble and stops the reaction.","keywords":[{"en":"effervescence","cn":"冒泡"},{"en":"dilute acid","cn":"稀酸"},{"en":"limewater test","cn":"石灰水检验"}]},{"id":"f19","unit":"chem-eq","type":"chem-eq","cn":"检验二氧化碳","en":"Test for carbon dioxide","expr":"二氧化碳 + 氢氧化钙 → 碳酸钙↓ + 水","exprEn":"carbon dioxide + calcium hydroxide → calcium carbonate + water","formula":"CO₂(g) + Ca(OH)₂(aq) → CaCO₃(s) + H₂O(l)","cond":"通入澄清石灰水","condEn":"bubble through limewater","noteCn":"现象：石灰水变浑浊。过量 CO₂ 会使浑浊消失（生成可溶性碳酸氢钙）。","noteEn":"Observation: limewater turns milky. Excess CO₂ clears the milkiness as soluble calcium hydrogencarbonate forms.","keywords":[{"en":"limewater","cn":"石灰水"},{"en":"precipitate","cn":"沉淀"},{"en":"observation","cn":"现象"}]},{"id":"f20","unit":"chem-eq","type":"chem-eq","cn":"电解水","en":"Electrolysis of water","expr":"水 ——(通电)→ 氢气 + 氧气","exprEn":"water —(electrolysis)→ hydrogen + oxygen","formula":"2H₂O(l) → 2H₂(g) + O₂(g)","cond":"通直流电，加入少量电解质增强导电性","condEn":"direct current; a little electrolyte added to conduct electricity","noteCn":"阴极（−）产生 H₂，阳极（+）产生 O₂，体积比 H₂:O₂ = 2:1。","noteEn":"Hydrogen forms at the cathode (−), oxygen at the anode (+); volume ratio H₂:O₂ = 2:1.","keywords":[{"en":"electrolysis","cn":"电解"},{"en":"anode / cathode","cn":"阳极 / 阴极"},{"en":"volume ratio","cn":"体积比"}]},{"id":"f21","unit":"chem-eq","type":"chem-eq","cn":"金属与酸反应制氢气","en":"Metal + acid reaction producing hydrogen","expr":"锌 + 稀硫酸 → 硫酸锌 + 氢气","exprEn":"zinc + sulfuric acid → zinc sulfate + hydrogen","formula":"Zn(s) + H₂SO₄(aq) → ZnSO₄(aq) + H₂(g)","cond":"常温，稀硫酸或稀盐酸","condEn":"room temperature, dilute acid","noteCn":"置换反应。氢前金属能置换酸中的氢；铜等氢后金属不能。【教材校对：酸碱反应属初三内容，上海初二教材未涉及，此处为 LC 衔接预习】","noteEn":"A displacement reaction. Metals above hydrogen in the reactivity series liberate H₂; copper does not.","keywords":[{"en":"displacement","cn":"置换反应"},{"en":"reactivity series","cn":"金属活动性顺序"}]},{"id":"f22","unit":"chem-eq","type":"chem-eq","cn":"铁置换铜","en":"Displacement of copper by iron","expr":"铁 + 硫酸铜 → 硫酸亚铁 + 铜","exprEn":"iron + copper(II) sulfate → iron(II) sulfate + copper","formula":"Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s)","cond":"把铁钉放入硫酸铜溶液","condEn":"iron nail in copper(II) sulfate solution","noteCn":"现象：铁钉表面覆盖红色铜，蓝色溶液逐渐变浅绿色。","noteEn":"Observation: a reddish-brown deposit of copper forms; the
