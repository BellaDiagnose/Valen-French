<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BELLA 助手</title>
<meta name="description" content="BELLA 助手 · 法语单词卡、变位表与复习计划，安装后可完全离线使用。">
<meta name="theme-color" content="#0f8a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BELLA 助手">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>BELLA 助手</h1>
      <p id="brand-sub">En Avant · 613 词</p>
    </div>
    <div class="ring" id="ring" aria-label="今日进度">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f8a5a"></stop>
            <stop offset="100%" stop-color="#22ac70"></stop>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="22" cy="22" r="18"></circle>
        <circle class="ring-fill" id="ring-fill" cx="22" cy="22" r="18"></circle>
      </svg>
      <div class="ring-text">
        <b id="ring-days">1</b><span>天</span>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="主导航"></nav>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="netbar" id="netbar" hidden>
    <span class="dot"></span><span id="netbar-text">离线模式 · 已缓存内容可正常使用</span>
  </footer>
</div>

<!-- 强制自测（跨天 ≥3 天时） -->
<div class="modal" id="force" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>先来 10 题热热身</h2>
      <p id="force-sub">已有 3 天没来，先自测确认记忆还在</p>
    </div>
    <div id="force-body"></div>
  </div>
</div>

<!-- 新版本就绪提示 -->
<button class="update-bar" id="update-bar" hidden>发现新版本 · 点此更新</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
